<!DOCTYPE html>
<html lang="es">

<head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Formulario de Registro de Perfil</title>

        <meta name="description" content="iniciar el registro de un usuario nuevo">
        <meta name="keywords" content="inicio, registro, registracion, iniciacion del cliente">
        <meta name="author" content="Franco Galluzzo">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
                integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
                crossorigin="anonymous">

        <link rel="stylesheet" href="../css/style.css">

</head>

<body class="formulario-registro-cuerpo">
        <div class="contenedor-registro">
                <h2>Registro de Perfil</h2>
                <form>
                        <label for="nombre">Nombre Completo</label>
                        <input type="text" id="nombre" name="nombre" required />


                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required />


                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required />


                        <label for="edad">Edad</label>
                        <input type="number" id="edad" name="edad" min="1" max="120" />


                        <label for="genero">Género</label>
                        <select id="genero" name="genero">
                                <option value="">Seleccione...</option>
                                <option value="masculino">Masculino</option>
                                <option value="femenino">Femenino</option>
                                <option value="otro">Otro</option>
                        </select>

                        <button type="submit">Registrarse</button>
                </form>
        </div>


        <div class="hr-linea"></div>

        <div class="fila-final">
                <a href="../index.html">Inicio</a></li>
                <a href="./guitarras.html">Guitarras</a></li>
                <a href="./bajos.html">Bajos</a></li>
                <a href="./amplificadores.html">Amplificadores</a></li>
                <a href="./redes-sociales.html">Redes Sociales</a></li>
                <a href="./contactos.html">Contactanos</a></li>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"></script>

</body>

</html>
