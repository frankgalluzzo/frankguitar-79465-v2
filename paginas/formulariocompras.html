<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Compra | Adquiere el instrumento de tus sueños</title>

    <meta name="description" content="formulario para cliente registrado que quiere realizar su compra">
    <meta name="keywords" content="instrumentos, compra, productos, usuarios clientes">
    <meta name="author" content="Franco Galluzzo">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
</head>



<body class="form-compras">

    <div class="container-compras">
        <h1>Formulario de Compra</h1>
        <p>Completa los datos para realizar tu pedido.</p>

        <form action="#" method="POST">

            <!-- Datos personales -->
            <h2>Datos Personales</h2>
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 11-5555-5555" required>
            </div>

            <!-- Dirección -->
            <h2>Dirección de Envío</h2>
            <div class="form-group">
                <label for="direccion">Dirección</label>
                <input type="text" id="direccion" name="direccion" placeholder="Calle y número" required>
            </div>

            <div class="form-group">
                <label for="ciudad">Ciudad</label>
                <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad" required>
            </div>

            <div class="form-group">
                <label for="cp">Código Postal</label>
                <input type="text" id="cp" name="cp" placeholder="Código Postal" required>
            </div>

            <!-- Producto -->
            <h2>Producto</h2>
            <div class="form-group">
                <label for="producto">Selecciona un producto</label>
                <select id="producto" name="producto" required>
                    <option value="">Seleccione una opción</option>
                    <option value="guitarra">Guitarra Eléctrica</option>
                    <option value="bajo">Bajo</option>
                    <option value="amplificador">Amplificador</option>
                    <option value="cable">Accesorios</option>
                </select>
            </div>
            <h2>Modelo</h2>
            <div class="form-group">
                <label for="producto">Selecciona un modelo</label>
                <select id="producto" name="producto" required>
                    <option value="">Seleccione una opción</option>
                    <option value="guitarra">Guitarra Shecter RV </option>
                    <option value="bajo">Bajo Schecter Gh</option>
                    <option value="amplificador">Amplificador Marshall Rv</option>
                    <option value="cable">Cable</option>
                </select>
            </div>


            <div class="form-group">
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
            </div>

            <!-- Pago -->
            <h2>Método de Pago</h2>

            <div class="form-group">
                <label for="pago">Elige un método</label>
                <select id="pago" name="pago" required>
                    <option value="">Seleccione una opción</option>
                    <option value="tarjeta">Tarjeta de Crédito/Débito</option>
                    <option value="transferencia">Transferencia Bancaria</option>
                    <option value="efectivo">Pago en efectivo</option>
                </select>
            </div>

            <!-- Botón -->
            <button type="submit" class="btn">Realizar Compra</button>
        </form>
    </div>

    <div class="hr-linea"></div>

    <div class="fila-final text-light">
        <a href="../index.html">Inicio</a></li>
        <a href="./guitarras.html">Guitarras</a></li>
        <a href="./bajos.html">Bajos</a></li>
        <a href="./amplificadores.html">Amplificadores</a></li>
        <a href="./redes-sociales.html">Redes Sociales</a></li>
        <a href="./contactos.html">Contactanos</a></li>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


</body>

</html>
